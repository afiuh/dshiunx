- id: llm
  name: '@deepseek-ai/dsh-llm'
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultContextWindow: 1000000
    streamIdleTimeoutMs: 172800000
- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'
- id: session
  name: '@deepseek-ai/dsh-session'
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: .dshiunx/sessions
    compression: none
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: true
    includeRuntimeContext: true
    personaPrefix: ''
- id: tools
  name: '@deepseek-ai/dsh-tools'
- id: agent
  name: '@deepseek-ai/dsh-agent'
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
- id: filesystem
  name: '@deepseek-ai/dsh-fs-local'
- id: working-directory
  name: '@deepseek-ai/dsh-working-directory'
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
- id: pty
  name: '@deepseek-ai/dsh-terminal'
- id: terminal-bash
  name: '@deepseek-ai/dsh-terminal-bash'
  config:
    timeoutMs: 300000
- id: persistent-bash
  name: '@deepseek-ai/dsh-tool-bash-persistent'
  config:
    timeoutMs: 300000
- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: /mnt/data/AI自由工作区/dshiunx
- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024
- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'
- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'
- id: spill-local
  name: '@deepseek-ai/dsh-spill-local'
- id: spill-policy
  name: '@deepseek-ai/dsh-spill-policy'
  config:
    maxInlineTokens: 12500
- id: session-checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'
- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'
  config:
    thresholds:
    - 3
    - 5
    - 8
    argumentsPreviewChars: 500
- id: image-offload
  name: '@deepseek-ai/dsh-compaction-image-offload'
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: standard
- id: skill
  name: '@deepseek-ai/dsh-skill'
- id: commands
  name: '@deepseek-ai/dsh-commands'
- id: command-feedback
  name: '@deepseek-ai/dsh-command-feedback'
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn
- id: subagent-fork
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork
- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
- id: goal
  name: '@deepseek-ai/dsh-goal'
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
- id: plugin-manager
  name: '@deepseek-ai/dsh-plugin-manager'
- id: ptc-runtime
  name: '@deepseek-ai/dsh-ptc-runtime-node'
- id: workflow-ptc
  name: '@deepseek-ai/dsh-workflow-ptc'
  config:
    provider: spawn
- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'
- id: cordis-host-runner
  name: '@deepseek-ai/dsh-cordis-host-runner'
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'
- id: tool-subagent-list
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
- id: tool-working-directory
  name: '@deepseek-ai/dsh-tool-working-directory'
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'
- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
- id: web
  name: '@deepseek-ai/dsh-web'
- id: web-fetch
  name: '@deepseek-ai/dsh-web-fetch-http'
- id: web-search
  name: '@deepseek-ai/dsh-web-search-deepseek'
- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'
- id: mcp-resources
  name: '@deepseek-ai/dsh-mcp-resources'
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
    - id: persona
      name: '@deepseek-ai/dsh-persona'
      config:
        prefix: You are a coding agent powered by the {{model}} model. Do not describe
          yourself as a plugin system or claim you can create plugins unless the user
          explicitly asks about the harness internals.
- id: preset-ptc
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: ptc
    order: 2
    plugins:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
    - id: persona
      name: '@deepseek-ai/dsh-persona'
      config:
        prefix: You are a coding agent powered by the {{model}} model. Do not describe
          yourself as a plugin system or claim you can create plugins unless the user
          explicitly asks about the harness internals.
- id: preset-minimal
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: minimal
    order: 3
    plugins:
    - id: persona
      name: '@deepseek-ai/dsh-persona'
      config:
        prefix: You are a helpful software engineer assistant.
        complete: true
        includeRuntimeContext: false
    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
      config:
        read: false
        readImage: true
        write: false
        edit: false
- id: preset-creator
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: creator
    order: 4
    plugins:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
    - id: persona
      name: '@deepseek-ai/dsh-persona'
      config:
        prefix: 'You are a coding agent powered by the {{model}} model. You work inside
          a Cordis plugin system where everything is a plugin: you can inspect the
          running plugin tree, write new Cordis plugins, and install them into the
          current profile. When a task needs a new capability, prefer creating a small
          plugin over ad-hoc scripting.'
